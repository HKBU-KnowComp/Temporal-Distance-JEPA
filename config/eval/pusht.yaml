defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

planning_cost:
  # Paper default for Push-T: latent L2 on the temporally trained checkpoint.
  # Modes: mse (latent L2) | td_jepa | contact_gate | normalized_mse | cosine
  mode: mse
  temperature: 0.1
  # 1.0 = terminal-only cost, 0.0 = trajectory-mean cost.
  terminal_weight: 1.0

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  save_video: null
  dataset_name: pusht_expert_train
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: pusht_results.txt

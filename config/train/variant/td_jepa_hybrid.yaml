# @package _global_
# Push-T: canonical TD-JEPA training (np=5) with LeWM-style latent L2 blended
# into the planning cost at evaluation only. Training losses unchanged.
#
# Use when d_psi calibration helps representation but latent L2 is the stronger
# Push-T planner (see scripts/sweep_pusht_planning_cost.py on saved checkpoints).

num_preds: 5
output_model_name: td_jepa_hybrid
model:
  planning_cost_mode: td_jepa
  planning_cost_mse_blend: 0.15
  dist_head:
    _target_: module.QuasimetricHead
    input_dim: ${embed_dim}
    hidden_dim: 512
    sym_dim: 128
    asym_dim: 128
loss:
  prediction:
    name: mse
    mse_weight: 0.0
    rollout_horizon: 5
    rollout_weight: 0.5
    td_weight: 1.0
    td_negative_margin_scale: 1.0
    td_negative_margin_steps: 7
  sigreg:
    weight: 0.09
planning_eval:
  planning_cost:
    mode: td_jepa
    mse_blend: 0.15

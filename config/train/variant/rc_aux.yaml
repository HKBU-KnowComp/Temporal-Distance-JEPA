# @package _global_
# RC-aux (concurrent baseline reimpl): LeWM backbone + multi-horizon open-loop prediction
# + budget-conditioned reachability with temporal hard negatives.
#
# Matches the paper novelty table: Directed=no, Plan use=auxiliary.
# No quasimetric / temporal-distance regression; plan with latent L2 (mse).

num_preds: 5
output_model_name: rc_aux
model:
  planning_cost_mode: mse
  reach_head:
    _target_: module.ReachabilityHead
    input_dim: ${embed_dim}
    hidden_dim: 512
loss:
  prediction:
    name: mse
    mse_weight: 0.0
    rollout_horizons: [1, 3, 5]
    rollout_weight: 0.5
    td_weight: 0.0
    td_plan_horizon: 5
    budget_reach_weight: 0.1
    budget_reach_hard_neg_weight: 1.0
    budget_reach_cross_neg_weight: 1.0
  sigreg:
    weight: 0.09
planning_eval:
  planning_cost:
    mode: mse

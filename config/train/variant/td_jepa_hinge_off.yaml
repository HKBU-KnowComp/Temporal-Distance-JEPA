# @package _global_
# Ablation: TD-JEPA without cross-trajectory negative hinge.
# Positive same-trajectory temporal regression, rollout consistency, and SIGReg
# are unchanged from the canonical short-window recipe.
num_preds: 5
output_model_name: td_jepa_hinge_off
model:
  planning_cost_mode: td_jepa
  dist_head:
    _target_: module.QuasimetricHead
    input_dim: ${embed_dim}
    hidden_dim: 512
    sym_dim: 128
    asym_dim: 128
loss:
  prediction:
    name: mse
    mse_weight: 0.0
    rollout_horizon: 5
    rollout_weight: 0.5
    td_weight: 1.0
    td_negative_margin_scale: 1.0
    td_negative_weight: 0.0
  sigreg:
    weight: 0.09
planning_eval:
  planning_cost:
    mode: td_jepa
